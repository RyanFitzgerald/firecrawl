name: firecrawl

x-common-service: &common-service
  build: apps/api

  ulimits:
    nofile:
      soft: 65535
      hard: 65535

  extra_hosts:
    - "host.docker.internal:host-gateway"

  restart: unless-stopped

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"


x-common-env: &common-env
  # Redis
  REDIS_URL: redis://redis:6379
  REDIS_RATE_LIMIT_URL: redis://redis:6379

  # Playwright
  PLAYWRIGHT_MICROSERVICE_URL: http://playwright-service:3000/scrape

  # PostgreSQL / NuQ
  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: nuq-postgres
  POSTGRES_PORT: "5432"

  # Explicitly use PostgreSQL queue backend.
  # Do not leave this empty.
  NUQ_BACKEND: "pg"

  # Self-hosted without Supabase auth.
  USE_DB_AUTHENTICATION: "false"

  # Explicit boolean because an empty value crashes config parsing
  # on the version currently running in your container.
  ALLOW_LOCAL_WEBHOOKS: "false"

  # Conservative initial concurrency.
  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-5}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-3}


services:

  playwright-service:
    build: apps/playwright-service-ts

    restart: unless-stopped

    environment:
      PORT: "3000"

      # Explicitly set instead of passing an unset Coolify variable.
      ALLOW_LOCAL_WEBHOOKS: "false"

      # Keep concurrency aligned with Firecrawl.
      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-5}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cpus: 2.0
    mem_limit: 4G

    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  api:
    <<: *common-service

    environment:
      <<: *common-env

      HOST: "0.0.0.0"
      PORT: "3002"

      EXTRACT_WORKER_PORT: "3004"
      WORKER_PORT: "3005"

      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672

      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}

      ENV: local

    depends_on:
      redis:
        condition: service_healthy

      rabbitmq:
        condition: service_healthy

      nuq-postgres:
        condition: service_healthy

      playwright-service:
        condition: service_started

    # Internal container port only.
    # Coolify / Traefik should route to this.
    expose:
      - "3002"

    command: node dist/src/harness.js --start-docker

    cpus: 4.0
    mem_limit: 8G


  redis:
    image: redis:alpine

    restart: unless-stopped

    command:
      - redis-server
      - --bind
      - "0.0.0.0"
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"


  rabbitmq:
    image: rabbitmq:3-management

    restart: unless-stopped

    command: rabbitmq-server

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"


  nuq-postgres:
    build: apps/nuq-postgres

    restart: unless-stopped

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
