name: firecrawl

x-common-service: &common-service
  # NOTE: If you don't want to build the service locally,
  # comment out the build: statement and uncomment the image: statement
  # image: ghcr.io/firecrawl/firecrawl
  build: apps/api

  ulimits:
    nofile:
      soft: 65535
      hard: 65535

  extra_hosts:
    - "host.docker.internal:host-gateway"

  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
      compress: "true"

x-common-env: &common-env
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}
  REDIS_RATE_LIMIT_URL: ${REDIS_RATE_LIMIT_URL:-${REDIS_URL:-redis://redis:6379}}

  PLAYWRIGHT_MICROSERVICE_URL: ${PLAYWRIGHT_MICROSERVICE_URL:-http://playwright-service:3000/scrape}

  POSTGRES_USER: ${POSTGRES_USER:-postgres}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
  POSTGRES_DB: ${POSTGRES_DB:-postgres}
  POSTGRES_HOST: ${POSTGRES_HOST:-nuq-postgres}
  POSTGRES_PORT: ${POSTGRES_PORT:-5432}

  USE_DB_AUTHENTICATION: ${USE_DB_AUTHENTICATION:-false}

  NUM_WORKERS_PER_QUEUE: ${NUM_WORKERS_PER_QUEUE:-4}
  CRAWL_CONCURRENT_REQUESTS: ${CRAWL_CONCURRENT_REQUESTS:-5}
  MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-3}
  BROWSER_POOL_SIZE: ${BROWSER_POOL_SIZE:-3}

  OPENAI_API_KEY: ${OPENAI_API_KEY}
  OPENAI_BASE_URL: ${OPENAI_BASE_URL}
  MODEL_NAME: ${MODEL_NAME}
  MODEL_EMBEDDING_NAME: ${MODEL_EMBEDDING_NAME}
  OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}

  AUTUMN_SECRET_KEY: ${AUTUMN_SECRET_KEY}
  SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
  BULL_AUTH_KEY: ${BULL_AUTH_KEY}
  TEST_API_KEY: ${TEST_API_KEY}

  SUPABASE_ANON_TOKEN: ${SUPABASE_ANON_TOKEN}
  SUPABASE_URL: ${SUPABASE_URL}
  SUPABASE_SERVICE_TOKEN: ${SUPABASE_SERVICE_TOKEN}

  SELF_HOSTED_WEBHOOK_URL: ${SELF_HOSTED_WEBHOOK_URL}

  LOGGING_LEVEL: ${LOGGING_LEVEL}

  PROXY_SERVER: ${PROXY_SERVER}
  PROXY_USERNAME: ${PROXY_USERNAME}
  PROXY_PASSWORD: ${PROXY_PASSWORD}

  SEARXNG_ENDPOINT: ${SEARXNG_ENDPOINT}
  SEARXNG_ENGINES: ${SEARXNG_ENGINES}
  SEARXNG_CATEGORIES: ${SEARXNG_CATEGORIES}

  # Leave unset to use Postgres for NuQ.
  # Set NUQ_BACKEND=fdb to use FoundationDB.
  NUQ_BACKEND: ${NUQ_BACKEND}
  FDB_CLUSTER_FILE: ${NUQ_BACKEND:+/var/fdb/fdb.cluster}


services:

  playwright-service:
    # NOTE: If you don't want to build the service locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/playwright-service:latest
    build: apps/playwright-service-ts

    environment:
      PORT: 3000

      PROXY_SERVER: ${PROXY_SERVER}
      PROXY_USERNAME: ${PROXY_USERNAME}
      PROXY_PASSWORD: ${PROXY_PASSWORD}

      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS}
      BLOCK_MEDIA: ${BLOCK_MEDIA}

      MAX_CONCURRENT_PAGES: ${CRAWL_CONCURRENT_REQUESTS:-5}

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    cpus: 2.0
    mem_limit: 4G
    memswap_limit: 4G

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

    tmpfs:
      - /tmp/.cache:noexec,nosuid,size=1g


  api:
    <<: *common-service

    environment:
      <<: *common-env

      HOST: "0.0.0.0"
      PORT: ${INTERNAL_PORT:-3002}

      EXTRACT_WORKER_PORT: ${EXTRACT_WORKER_PORT:-3004}
      WORKER_PORT: ${WORKER_PORT:-3005}

      NUQ_RABBITMQ_URL: amqp://rabbitmq:5672

      HARNESS_STARTUP_TIMEOUT_MS: ${HARNESS_STARTUP_TIMEOUT_MS:-60000}

      ENV: local

    depends_on:
      redis:
        condition: service_started

      playwright-service:
        condition: service_started

      rabbitmq:
        condition: service_healthy

    # Do NOT expose a host port here.
    # Coolify/Traefik should proxy directly to container port 3002.

    volumes:
      - fdb-cluster-file:/var/fdb:ro

    command: node dist/src/harness.js --start-docker

    cpus: 4.0
    mem_limit: 8G
    memswap_limit: 8G


  redis:
    image: redis:alpine

    # Enable AOF persistence.
    command:
      - redis-server
      - --bind
      - "0.0.0.0"
      - --appendonly
      - "yes"

    volumes:
      - redis-data:/data

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"


  rabbitmq:
    image: rabbitmq:3-management

    command: rabbitmq-server

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

    healthcheck:
      test:
        - CMD
        - rabbitmq-diagnostics
        - -q
        - check_running
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 5s

    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"
        compress: "true"


  nuq-postgres:
    # NOTE: If you don't want to build the image locally,
    # comment out the build: statement and uncomment the image: statement
    # image: ghcr.io/firecrawl/nuq-postgres:latest
    build: apps/nuq-postgres

    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  # Experimental FoundationDB queue backend.
  #
  # Leave NUQ_BACKEND unset to continue using PostgreSQL.
  # Set NUQ_BACKEND=fdb if you intentionally want FoundationDB.
  foundationdb:
    image: foundationdb/foundationdb:7.3.63

    environment:
      FDB_NETWORKING_MODE: container
      FDB_COORDINATOR_PORT: 4500

    volumes:
      - fdb-data:/var/fdb/data
      - fdb-cluster-file:/var/fdb

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"


  # One-shot initialization for FoundationDB.
  foundationdb-init:
    image: foundationdb/foundationdb:7.3.63

    depends_on:
      - foundationdb

    entrypoint:
      - /bin/bash
      - -c
      - >-
        sleep 5 &&
        out=$(fdbcli -C /var/fdb/fdb.cluster --exec 'configure new single ssd' 2>&1);
        status=$$?;
        printf '%s\n' "$$out";
        if [ "$$status" -eq 0 ]; then
          exit 0;
        fi;
        printf '%s\n' "$$out" |
        grep -Eiq 'already.*configured|database.*configured|database.*already exists'

    volumes:
      - fdb-cluster-file:/var/fdb

    restart: "no"


volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  fdb-data:
  fdb-cluster-file:
